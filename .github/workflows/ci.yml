name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test the app imports
        run: python -c "from main import app; print('App imports OK')"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t openshift-devops-demo .

  deploy:
    needs: [test, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Install oc CLI
        uses: redhat-actions/oc-installer@v1

      - name: Log in to OpenShift
        run: oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: Trigger build and deploy
        run: |
          oc project moha2552005-dev
          oc start-build openshift-devops-demo --follow
